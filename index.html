!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Politikerspillet</title><style>body{font-family:Arial;margin:0;background:#eef3f4;color:#172326;font-size:0}main{font-size:16px;max-width:960px;margin:auto;padding:16px}.c{background:white;border:1px solid #d9e2e1;border-radius:8px;padding:15px;margin:10px 0;box-shadow:0 8px 24px #0001}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}button{width:100%;padding:12px;border:0;border-radius:7px;background:#0f766e;color:white;font-weight:700}.m{background:#fff8e8}</style><main id=a></main>main><script>let y=2025,n=0,k=0,msg='',S={p:60,g:35,o:54,t:55},D=[['Skole','Gratis leksehjelp',[-18,3,7],[-5,-3,1],[-7,-4,9]],['Skatt','&Oslash;ke skatt for h&oslash;y inntekt',[15,-5,0],[4,-4,1],[2,-6,4]],['Helse','Kortere helsek&oslash;er',[-22,7,0],[-6,-3,1],[-8,-4,2]],['Klima','Gr&oslash;nn energi',[-3,5,-6],[-7,-3,2],[-18,-6,12]],['Trygghet','Ungdomskriminalitet',[-16,8,0],[-7,-3,1],[-9,-5,6]],['Arbeid','Flere l&aelig;rlingeplasser',[-16,7,1],[-5,-3,1],[-12,-4,7]],['Bolig','Leieprisene stiger',[-15,8,0],[-5,-4,1],[-7,-5,6]],['Krise','Flom rammer landet',[-26,10,2],[-8,-4,2],[-19,-3,8]],['&Oslash;konomi','Renteutgiftene &oslash;ker',[8,4,-6],[6,-4,1],[25,-10,8]],['Valgkamp','Opposisjonen lover skattekutt',[-22,12,-7],[-4,-5,1],[3,-8,8]],['Eldreomsorg','Kommunene mangler folk',[-23,9,0],[-7,-4,1],[-9,-4,7]],['Siste valg','Hva husker velgerne?',[-25,12,-8],[-5,-6,1],[4,-8,9]]];function cl(x){return Math.max(0,Math.min(100,Math.round(x)))}function C(n,v){return'<div class=c>'+n+'<br><b>'+v+'</b></div>'}function draw(e){let d=D[n%D.length],T=['Popul&aelig;rt n&aring;','Kompromiss','Langsiktig'];a.innerHTML=e?'<div class=c><h1>'+e+'</h1><p>Budsjett '+S.p+' mrd, gjeld '+S.g+'%, oppslutning '+S.o+'%, tillit '+S.t+'%.</p><p>Diskuter: N&aring;r m&aring; politikere velge tydelig?</p><button onclick=location.reload()>Spill igjen</button></div>':'<h1>Politikerspillet</h1><div class=g>'+C('&Aring;r',y)+C('Budsjett',S.p+' mrd')+C('Gjeld',S.g+'%')+C('Oppslutning',S.o+'%')+'</div><div class=c><h2>'+d[0]+': '+d[1]+'</h2><p>Du m&aring; f&aring; noe gjort, ha r&aring;d til det og vinne valg. Kompromiss roer saken, men ingen f&aring;r nok.</p><p>Tillit '+S.t+'</p></div>'+(msg?'<div class="c m"><b>Konsekvens:</b> '+msg+'</div>':'')+'<div class=g>'+T.map((t,i)=>'<div class=c><h3>'+t+'</h3><p>'+(i==1?'Litt til alle. Saken l&oslash;ses ikke.':'Budsjett '+d[i+2][0]+', oppslutning '+d[i+2][1]+', tillit '+d[i+2][2])+'</p><button onclick=go('+i+')>Velg</button></div>').join('')+'</div>'}function go(x){let e=D[n%D.length][x+2];k=x==1?k+1:0;S.p+=e[0];S.o+=e[1];S.t+=e[2];msg=x==1?'Kompromiss: flere grupper mener de fikk for lite.':'Du tok et tydelig valg.';if(x==0)S.g+=3;if(k>1){S.o-=4+k*2;S.t-=2;msg+=' Velgerne straffer uklare prioriteringer.'}if(S.p<0){S.g+=Math.ceil(-S.p/2);S.p=5;S.o-=3;S.t-=4;msg+=' Du m&aring;tte l&aring;ne penger.'}S.p+=7;S.o+=Math.round((S.t-55)/12);for(let z in S)S[z]=cl(S[z]);n++;if(n%2==0)y++;if(S.g>95)return draw('&Oslash;konomisk sammenbrudd');if(S.t<20||S.o<20)return draw('Regjeringen faller');if(n%4==0){let v=S.o+Math.round((S.t-50)/8)-Math.round(Math.max(0,S.g-55)/10);if(v<=52)return draw('Du tapte valget med '+v+'% oppslutning');S.o-=6}if(n>=D.length)return draw('Seier: Du styrte i tre valgperioder');draw()}draw();setTimeout(()=>{while(a.nextSibling)a.nextSibling.remove()})</script></script></style></title>
