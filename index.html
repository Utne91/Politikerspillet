<<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Politikerspillet</title><style>body{font-family:Arial;margin:0;background:#eef3f4;color:#172326;font-size:0}main{font-size:16px;max-width:900px;margin:auto;padding:16px}.c{background:white;border:1px solid #d9e2e1;border-radius:8px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}button{width:100%;padding:12px;border:0;border-radius:7px;background:#0f766e;color:white;font-weight:700}.m{background:#fff8e8}</style><main id=a></main><script>let y=2025,n=0,l=-1,s=0,m='',S={p:60,d:35,o:64,t:55},D=[["Skole","Fagresultatene faller",0,[-16,4,6,2],[-5,-4,1,0],[-8,-5,8,0]],["Matkrise","Dyr mat rammer familier",1,[-24,11,2,5],[-8,-7,0,1],[-12,-9,5,2]],["Skatt","Du trenger penger",0,[12,-6,-2,-4],[4,-4,1,-1],[2,-7,5,-3]],["Str&oslash;mkrise","Str&oslash;mprisene hopper",1,[-22,12,1,5],[-7,-8,0,1],[-14,-10,7,2]],["Helse","Helsek&oslash;ene &oslash;ker",0,[-20,8,1,3],[-6,-4,1,0],[-10,-5,7,1]],["Trygghet","Ungdomskriminalitet",0,[-15,8,-1,3],[-6,-4,1,0],[-9,-5,6,0]],["Flom","Flom &oslash;delegger veier",1,[-26,12,3,6],[-9,-8,1,2],[-18,-7,8,3]],["&Oslash;konomi","Renteutgiftene &oslash;ker",0,[10,4,-7,-5],[6,-4,1,-2],[24,-11,8,-8]],["Bolig","Leieprisene stiger",0,[-14,8,0,3],[-5,-5,1,0],[-8,-6,6,0]],["Valg","Velgerne vurderer alt",0,[-24,12,-8,6],[-5,-7,1,0],[4,-9,8,-4]]];function cl(x){return Math.max(0,Math.min(100,Math.round(x)))}function C(n,v){return'<div class=c>'+n+'<br><b>'+v+'</b></div>'}function E(e){a.innerHTML='<div class=c><h1>'+e+'</h1><p>Budsjett '+S.p+' mrd, gjeld '+S.d+'%, oppslutning '+S.o+'%, tillit '+S.t+'%.</p><p>Diskuter: Hvilke kriser m&aring;tte l&oslash;ses raskt? Hvorfor holder det ikke &aring; velge samme strategi?</p><button onclick=location.reload()>Spill igjen</button></div>'}function R(){let q=D[n],T=['Raskt grep','Kompromiss','Langsiktig'];a.innerHTML='<h1>Politikerspillet</h1><div class=g>'+C('&Aring;r',y)+C('Budsjett',S.p+' mrd')+C('Gjeld',S.d+'%')+C('Oppslutning',S.o+'%')+'</div><div class=c><h2>'+q[0]+': '+q[1]+'</h2><p>'+(q[2]?'KRISE: Handler du ikke raskt, blir folk sinte.':'Samme strategi hele tiden straffer seg.')+'</p><p>Tillit '+S.t+'</p></div>'+(m?'<div class="c m"><b>Konsekvens:</b> '+m+'</div>':'')+'<div class=g>'+T.map((t,i)=>'<div class=c><h3>'+t+'</h3><p>'+(i==1?'Litt til alle. Saken l&oslash;ses ikke.':'Budsjett '+q[i+3][0]+', oppslutning '+q[i+3][1]+', tillit '+q[i+3][2])+'</p><button onclick=G('+i+')>Velg</button></div>').join('')+'</div>'}function G(x){let q=D[n],e=q[x+3];s=x==l?s+1:1;l=x;S.p+=e[0];S.o+=e[1];S.t+=e[2];S.d+=e[3];m=x==0?'Du handlet raskt.':x==1?'Kompromiss: flere fikk for lite.':'Du prioriterte langsiktig.';if(s>1){S.o-=4+s*3;S.t-=2;m+=' Velgerne straffer gjentakelse.'}if(q[2]&&x!=0){S.o-=12;S.t-=4;m+=' Krisen ble ikke l&oslash;st raskt nok.'}if(S.p<0){S.d+=Math.ceil(-S.p/2);S.p=5;S.o-=3;S.t-=4;m+=' Du m&aring;tte l&aring;ne penger.'}S.p+=7;S.o+=Math.round((S.t-55)/12);for(let z in S)S[z]=cl(S[z]);n++;if(n%2==0)y++;if(S.d>95)return E('&Oslash;konomisk sammenbrudd');if(S.t<20||S.o<20)return E('Regjeringen faller');if(n%4==0){let v=S.o+Math.round((S.t-50)/8)-Math.round(Math.max(0,S.d-55)/10);if(v<=48)return E('Du tapte valget med '+v+'% oppslutning');S.o-=6}if(n>=D.length)return E(S.o>48?'Seier: Du ble gjenvalgt':'Du tapte valget med '+S.o+'% oppslutning');R()}R();setTimeout(()=>{while(a.nextSibling)a.nextSibling.remove()})</script>
