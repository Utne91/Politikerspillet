#229;r rask hjelp med regningene. Staten l&#229;ner mer.",-22,12,1,5],["St&#248;tten treffer noen, men mange f&#248;ler seg glemt.",-7,-8,0,1],["Du bygger for fremtiden, men vinterregningen er her n&#229;.",-14,-10,7,2]],["&#127973;","Helse","Helsek&#248;ene &#248;ker",0,["K&#248;ene faller raskt, men det koster mye.",-20,8,1,3],["Sykehusene f&#229;r litt mer, men ventelistene er der fortsatt.",-6,-4,1,0],["Systemet blir bedre, men pasientene m&#229; vente.",-10,-5,7,1]],["&#128110;","Trygghet","Ungdomskriminalitet",0,["Folk f&#248;ler raskere trygghet, men noen mener du er for hard.",-15,8,-1,3],["Kommunene f&#229;r litt st&#248;tte, men problemet roer seg lite.",-6,-4,1,0],["Forebygging kan virke, men nabolagene vil se handling n&#229;.",-9,-5,6,0]],["&#127754;","Flom","Flom &#248;delegger veier",1,["Veier repareres raskt. Regningen blir stor.",-26,12,3,6],["Du prioriterer de verste stedene, men mange venter.",-9,-8,1,2],["Sikrere veier bygges, men folk st&#229;r fast i dag.",-18,-7,8,3]],["&#128200;","&#216;konomi","Renteutgiftene &#248;ker",0,["Du kutter hardt. Markedet roer seg, folk blir sure.",10,4,-7,-5],["Du tar litt kutt og litt l&#229;n. Ingen blir helt forn&#248;yd.",6,-4,1,-2],["Du betaler ned gjeld, men m&#229; si nei til popul&#230;re &#248;nsker.",24,-11,8,-8]],["&#127968;","Bolig","Leieprisene stiger",0,["Unge leietakere f&#229;r hjelp raskt. Det er dyrt.",-14,8,0,3],["Tiltaket er forsiktig. Presset i byene fortsetter.",-5,-5,1,0],["Flere boliger planlegges, men effekten kommer sent.",-8,-6,6,0]],["&#128499;","Valg","Velgerne vurderer alt",0,["Du lover mye rett f&#248;r valget. Det virker, men er dyrt.",-24,12,-8,6],["Du pr&#248;ver &#229; roe alle. Velgerne savner retning.",-5,-7,1,0],["Du er &#230;rlig om vanskelige valg. Noen respekterer det.",4,-9,8,-4]]];function cl(x){return Math.max(0,Math.min(100,Math.round(x)))}function cls(v){return v<35?'bad':v<55?'warn':''}function M(n,v){return'<div class=c><b>'+n+'</b><h2>'+v+'%</h2><div class="bar '+cls(v)+'"><i style=width:'+v+'%></i></div></div>'}function E(e){a.innerHTML='<div class=c><h1>'+e+'</h1><p class=tag>'+face()+'</p><p>Budsjett '+S.p+' mrd, gjeld '+S.d+'%, oppslutning '+S.o+'%, tillit '+S.t+'%.</p><p><b>Til diskusjon:</b> Hvem ble forn&#248;yd? Hvem betalte prisen? Hvorfor holder det ikke &#229; velge samme strategi hver gang?</p><button onclick=location.reload()>Spill igjen</button></div>'}function face(){return S.o>65?'Befolkningen er forn&#248;yd':S.o>48?'Befolkningen er usikker':'Befolkningen er sint'}function R(){let q=D[n],T=['Rask l&#248;sning','Mellomvei','Lang plan'];a.innerHTML='<div class=top><div class=seal>&#127984;</div><div><h1>Politikerspillet</h1><span class=tag>'+face()+'</span></div></div><div class=g>'+M('Oppslutning',S.o)+M('Tillit',S.t)+M('Budsjett',S.p)+M('Gjeld',100-S.d)+'</div><div class="c '+(q[3]?'hot':'')+'"><h2>'+q[0]+' '+q[1]+': '+q[2]+'</h2><p>'+(q[3]?'KRISE: L&#248;ses dette tregt, blir folk sv&#230;rt misforn&#248;yde.':'Velgerne f&#248;lger med p&#229; om du varierer og prioriterer.')+'</p><p>&#197;r '+y+'</p></div>'+(m?'<div class="c m"><b>Konsekvens:</b> '+m+'</div>':'')+'<div class=g>'+T.map((t,i)=>'<div class="c choice"><h3>'+t+'</h3><p>'+q[i+4][0]+'</p><button onclick=G('+i+')>Velg</button></div>').join('')+'</div>'}function G(x){let q=D[n],e=q[x+4];s=x==l?s+1:1;l=x;S.p+=e[1];S.o+=e[2];S.t+=e[3];S.d+=e[4];m=e[0];if(s>1){S.o-=4+s*3;S.t-=2;m+=' Folk merker at du bruker samme oppskrift igjen.'}if(q[3]&&x!=0){S.o-=12;S.t-=4;m+=' Krisen ble ikke l&#248;st raskt nok.'}if(S.p<0){S.d+=Math.ceil(-S.p/2);S.p=5;S.o-=3;S.t-=4;m+=' Du m&#229;tte l&#229;ne penger.'}S.p+=7;S.o+=Math.round((S.t-55)/12);for(let z in S)S[z]=cl(S[z]);n++;if(n%2==0)y++;if(S.d>95)return E('&#216;konomisk sammenbrudd');if(S.t<20||S.o<20)return E('Regjeringen faller');if(n%4==0){let v=S.o+Math.round((S.t-50)/8)-Math.round(Math.max(0,S.d-55)/10);if(v<=48)return E('Du tapte valget med '+v+'% oppslutning');S.o-=6}if(n>=D.length)return E(S.o>48?'Seier: Du
