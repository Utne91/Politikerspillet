!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Politikerspillet</title><style>body{font-family:Arial;margin:0;background:#eef3f4;color:#172326;font-size:0}main{font-size:16px;max-width:980px;margin:auto;padding:16px}.c{background:white;border:1px solid #d9e2e1;border-radius:8px;padding:15px;margin:10px 0;box-shadow:0 8px 24px #0001}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}button{width:100%;padding:12px;border:0;border-radius:7px;background:#0f766e;color:white;font-weight:700}.b{height:9px;background:#d9e2e1;border-radius:9px}.b i{display:block;height:100%;background:#0f766e}.w i{background:#b7791f}.r i{background:#c24135}</style><main id=a></main>main><script>let y=2025,n=0,bal=0,S={p:60,g:35,o:54,t:55,h:50,k:50,m:50},D=[['Skole','Gratis leksehjelp',[-18,3,7],[-9,2,5],[-7,-4,9]],['Skatt','&Oslash;ke skatt for h&oslash;y inntekt',[15,-5,0],[8,-2,1],[2,-6,4]],['Helse','Kortere helsek&oslash;er',[-22,7,0],[-12,3,0],[-8,-4,2]],['Klima','Gr&oslash;nn energi',[-3,5,-6],[-12,1,7],[-18,-6,12]],['Trygghet','Ungdomskriminalitet',[-16,8,0],[-13,2,3],[-9,-5,6]],['Arbeid','Flere l&aelig;rlingeplasser',[-16,7,1],[-10,3,4],[-12,-4,7]],['Bolig','Leieprisene stiger',[-15,8,0],[-9,2,3],[-7,-5,6]],['Krise','Flom rammer landet',[-26,10,2],[-16,3,5],[-19,-3,8]],['&Oslash;konomi','Renteutgiftene &oslash;ker',[8,4,-6],[18,-5,4],[25,-10,8]],['Valgkamp','Opposisjonen lover skattekutt',[-22,12,-7],[-8,4,2],[3,-8,8]],['Eldreomsorg','Kommunene mangler folk',[-23,9,0],[-14,3,4],[-9,-4,7]],['Siste valg','Hva husker velgerne?',[-25,12,-8],[-7,4,3],[4,-8,9]]];function cl(x){return Math.max(0,Math.min(100,Math.round(x)))}function bar(n,v,b){let z=b?100-v:v,q=z<35?'r':z<55?'w':'';return n+' '+v+'<div class="b '+q+'"><i style="width:'+cl(z)+'%"></i></div>'}function card(n,v){return'<div class=c>'+n+'<br><b>'+v+'</b></div>'}function draw(e){let d=D[n%D.length],T=['Popul&aelig;rt n&aring;','Balansert','Langsiktig'];a.innerHTML=e?'<div class=c><h1>'+e+'</h1><p>Budsjett '+S.p+' mrd, gjeld '+S.g+'%, oppslutning '+S.o+'%, tillit '+S.t+'%.</p><p>Diskuter hva som var popul&aelig;rt, dyrt og langsiktig.</p><button onclick=location.reload()>Spill igjen</button></div>':'<h1>Politikerspillet</h1><div class=g>'+card('&Aring;r',y)+card('Budsjett',S.p+' mrd')+card('Gjeld',S.g+'%')+card('Oppslutning',S.o+'%')+'</div><div class=c><h2>'+d[0]+': '+d[1]+'</h2><p>Du m&aring; f&aring; noe gjort, ha r&aring;d til det og vinne valg. Samme strategi hver gang straffer seg.</p>'+bar('Tillit',S.t)+bar('Helse',S.h)+bar('Skole',S.k)+bar('Klima',S.m)+bar('Gjeld',S.g,1)+'</div><div class=g>'+T.map((t,i)=>'<div class=c><h3>'+t+'</h3><p>Budsjett '+d[i+2][0]+', oppslutning '+d[i+2][1]+', tillit '+d[i+2][2]+'</p><button onclick=go('+i+')>Velg</button></div>').join('')+'</div>'}function go(x){let e=D[n%D.length][x+2];bal=x==1?bal+1:0;S.p+=e[0];S.o+=e[1];S.t+=e[2];if(x==0)S.g+=3;if(x==2){S.m+=4;S.k+=2}if(bal>2){S.o-=6+bal;S.t-=2}if(S.p<0){S.g+=Math.ceil(-S.p/2);S.p=5;S.o-=3;S.t-=4}S.p+=7;S.o+=Math.round((S.t-55)/12);for(let k in S)S[k]=cl(S[k]);n++;if(n%2==0)y++;if(S.g>95)return draw('&Oslash;konomisk sammenbrudd');if(S.t<20||S.o<20)return draw('Regjeringen faller');if(n%4==0){let v=S.o+Math.round((S.t-50)/8)-Math.round(Math.max(0,S.g-55)/10);if(v<=52)return draw('Du tapte valget med '+v+'% oppslutning');S.o-=6}if(n>=D.length)return draw('Seier: Du styrte i tre valgperioder');draw()}draw();setTimeout(()=>{while(a.nextSibling)a.nextSibling.remove()})</script></script></style></title>
